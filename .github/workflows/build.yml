name: Build Modular (macOS)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 (keep a stable toolchain)
        run: |
          ls /Applications | grep -i xcode || true
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then sudo xcode-select -s "/Applications/Xcode_$v.app"; break; fi
          done
          xcodebuild -version

      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git "juce/one shot sampler/JUCE"

      - name: Configure
        working-directory: juce/one shot sampler
        run: cmake -B ci-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DMODULAR_SKIP_DRIFT_FIX=ON

      - name: Build
        working-directory: juce/one shot sampler
        shell: bash
        run: |
          set -o pipefail
          cmake --build ci-build --config Release --parallel 4 2>&1 | grep -v 'deprecated\|note:\|\[\[deprecated\|\^\|^ *[0-9]* |\|^ *|' | tee build.log

      - name: Package
        working-directory: juce/one shot sampler
        run: |
          mkdir -p ../../out
          cd ci-build/OneShotSampler_artefacts/Release
          ls -R . | head -50
          # Ad-hoc sign every bundle so macOS accepts it (free, no Apple account needed).
          find . -maxdepth 2 \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) -print0 | while IFS= read -r -d '' b; do
            codesign --force --deep --sign - "$b" && codesign --verify --verbose=2 "$b"
          done
          for d in VST3 AU Standalone; do
            [ -d "$d" ] && ditto -c -k --sequesterRsrc --keepParent "$d" "$GITHUB_WORKSPACE/out/Modular-$d.zip"
          done
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Build universal beta installer
        working-directory: juce/one shot sampler/ci-build/OneShotSampler_artefacts/Release
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          components="$(mktemp -d)/components.plist"
          package="$GITHUB_WORKSPACE/out/Modular-Beta-2-macOS.pkg"
          stage_bundle() {
            local bundle="$1" destination="$2" executable
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
            lipo -verify_arch arm64 x86_64 "$bundle/Contents/MacOS/$executable"
            codesign --verify --deep --strict "$bundle"
            mkdir -p "$root/$destination"
            ditto "$bundle" "$root/$destination/$(basename "$bundle")"
          }
          stage_bundle "Standalone/Modular Beta 2.app" "Applications"
          stage_bundle "AU/Modular Beta 2.component" "Library/Audio/Plug-Ins/Components"
          stage_bundle "VST3/Modular Beta 2.vst3" "Library/Audio/Plug-Ins/VST3"
          pkgbuild --analyze --root "$root" "$components"
          python3 - "$components" <<'PY'
          import plistlib
          import sys

          path = sys.argv[1]
          with open(path, "rb") as source:
              bundles = plistlib.load(source)
          for bundle in bundles:
              bundle["BundleIsRelocatable"] = False
              bundle["BundleOverwriteAction"] = "upgrade"
              bundle["BundleIsVersionChecked"] = False
          with open(path, "wb") as destination:
              plistlib.dump(bundles, destination)
          PY
          pkgbuild --root "$root" --component-plist "$components" \
            --identifier com.frameworks.modular.beta2 --version 0.1.0 \
            --install-location / "$package"
          pkgutil --payload-files "$package" | tee "$RUNNER_TEMP/modular-payload.txt"
          for bundle in \
            'Applications/Modular Beta 2.app' \
            'Library/Audio/Plug-Ins/Components/Modular Beta 2.component' \
            'Library/Audio/Plug-Ins/VST3/Modular Beta 2.vst3'; do
            grep -F "$bundle/Contents/Info.plist" "$RUNNER_TEMP/modular-payload.txt"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Modular-macOS-Installer
          path: out/Modular-Beta-2-macOS.pkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Modular-macOS
          path: out/*.zip
